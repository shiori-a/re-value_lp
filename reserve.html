      <!-- お客様情報 -->
      <h2 class="form-block-title">お客様情報</h2>

      <div class="form-row customer">
        <label>お名前</label>
        <input type="text"  name="name" required>
      </div>

      <div class="form-row customer">
        <label>TEL</label>
        <input type="tel" name="tel" required>
      </div>

      <div class="form-row customer">
        <label>E-mail</label>
        <input type="email" name="email" required>
      </div>

      <div class="form-row double">
        <label>第1希望</label>
        <select name="date1" required>
          <option>希望日を選択</option>
          <option>2025/11/11</option>
          <option>2025/11/12</option>
          <option>2025/11/13</option>
          <option>2025/11/14</option>
          <option>2025/11/15</option>
          <option>2025/11/16</option>

          <option>2025/11/23</option>
          <option>2025/11/24</option>
          <option>2025/11/25</option>
          <option>2025/11/26</option>
          <option>2025/11/27</option>

          
        </select>

        <select name="time1" required>
          <option>時間を選択</option>
          <option>11:00</option>
          <option>12:00</option>
          <option>13:00</option>
          <option>14:00</option>
          <option>15:00</option>
          <option>16:00</option>
          <option>17:00</option>
          <option>18:00</option>
          <option>19:00</option>
        </select>
      </div>

      <div class="form-row double">

        <select name="date2">
          <option>希望日を選択</option>

          <option>2025/11/27</option>

        <select name="time2">

      <button type="submit" class="form-submit-btn">査定予約</button>
